name: Deploy Grok Trencher to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy to VPS
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js App
        run: npm run build

      - name: Compress Build Output
        run: tar -czf next-build.tar.gz .next

      - name: Copy Build to VPS via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST || '103.30.194.148' }}
          username: ${{ secrets.VPS_USERNAME || 'AlzaSniped' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "next-build.tar.gz"
          target: "~/AI-AGENT-MEMECOIN-ALZA"
          overwrite: true

      - name: Execute Remote Sync and PM2 Reload
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '103.30.194.148' }}
          username: ${{ secrets.VPS_USERNAME || 'AlzaSniped' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 [CI/CD] Sinkronisasi VPS..."
            cd ~/AI-AGENT-MEMECOIN-ALZA

            echo "📥 Mengambil kode terbaru dari GitHub..."
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Memeriksa dependencies (hanya module ringan)..."
            npm install --production=false

            echo "🗜️ Mengekstrak build dari GitHub Actions..."
            tar -xzf next-build.tar.gz
            rm next-build.tar.gz

            echo "⚡ Memuat ulang proses di PM2..."
            if pm2 list | grep -q "grok-trencher"; then
              pm2 restart grok-trencher
            else
              pm2 restart all
            fi
            pm2 save

            echo "=========================================================="
            echo "🎉 AUTO-DEPLOY BERHASIL! (Build dilakukan di GitHub Actions)"
            echo "=========================================================="
