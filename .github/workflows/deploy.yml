name: Deploy Grok Trencher to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS via SSH
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 [CI/CD] Memulai deployment otomatis di VPS..."

            # 1. Masuk ke direktori repository
            if [ -d "$HOME/AI-AGENT-MEMECOIN-ALZA" ]; then
              cd "$HOME/AI-AGENT-MEMECOIN-ALZA"
            elif [ -d "/var/www/AI-AGENT-MEMECOIN-ALZA" ]; then
              cd "/var/www/AI-AGENT-MEMECOIN-ALZA"
            else
              cd ~/AI-AGENT-MEMECOIN-ALZA
            fi

            echo "📥 [1/4] Mengambil kode terbaru dari GitHub..."
            git fetch origin main
            git reset --hard origin/main

            echo "📦 [2/4] Memeriksa dependencies..."
            npm install --production=false

            echo "🔨 [3/4] Melakukan build Next.js (npm run build)..."
            npm run build

            echo "⚡ [4/4] Memuat ulang proses di PM2..."
            pm2 restart grok-trencher || pm2 restart all

            echo "=========================================================="
            echo "🎉 AUTO-DEPLOY BERHASIL! Terminal aktif dengan kode terbaru."
            echo "=========================================================="
